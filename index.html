<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://niviz.org/lib/niviz-bundle-latest.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 12px;
    }

    #plots {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: nowrap;
    }

    /* Main seasonal timeline */
    #timeline {
      width: 65vw;
      height: 75vh;
      min-width: 600px;
    }

    /* Point profile */
    #profile {
      width: 30vw;
      height: 75vh;
      min-width: 380px;
    }

    svg {
      border: 1px solid #ccc;
    }

    select {
      font-size: 16px;
      padding: 4px 8px;
      margin-left: 8px;
    }

    button {
      margin-right: 6px;
      margin-top: 6px;
    }
  </style>
</head>

<script>
var timelinegraph = null;
var profilegraph  = null;

// Load selected station
function loadStation(filename) {

  $.ajax({
    url: "data/" + filename,
    success: function (response) {

      niviz.parse(response, 'pro', function (error, station) {

        if (error) {
          alert('NiViz PRO parse error');
          return;
        }

        niviz.Common.defaults.language = 'english';

        // Clear previous plots
        $('#timeline').empty();
        $('#profile').empty();

        timelinegraph = niviz.draw(
          'Timeline',
          station,
          $('#timeline'),
          { parameter: 'grainshape' }
        );

        profilegraph = niviz.draw(
          'SimpleProfile',
          station,
          $('#profile'),
          { miniature: true }
        );

        station.emitter.on('profile', update);
      });
    },
    error: function () {
      alert("Failed to load " + filename);
    }
  });
}

// Called on page load
function draw() {
  loadStation("YESA2.pro");
}

function update(profile) {
  document.getElementById('currentdate').innerText =
    profile.date.format('DD MMM YYYY HH:mm');
}

// Timeline parameter buttons
function parameter(p) {
  if (!timelinegraph) return;
  timelinegraph.setProperties({ parameter: p });
  timelinegraph.draw();
}

// Dropdown change handler
function changeSite(selectObj) {
  loadStation(selectObj.value);
}
</script>

<body onload="draw()">

<h2>SNOWPACK – NiViz Visualization</h2>

<label for="siteSelect"><strong>Select Site:</strong></label>
<select id="siteSelect" onchange="changeSite(this)">
  <option value="YESA2.pro">Alyeska Mid Mountain</option>
  <option value="ARCA2.pro">Arctic Valley Top</option>
  <option value="HATA2.pro">Hatcher Pass - Independence Mine</option>
</select>

<br><br>

<div id="plots">
  <svg id="timeline"></svg>
  <svg id="profile"></svg>
</div>

<div id="currentdate">
  Hover over the timeline graph
</div>

<br>

<!-- Timeline controls -->
<button onclick="parameter('grainshape')">Grain Shape</button>
<button onclick="parameter('temperature')">Temperature</button>
<button onclick="parameter('density')">Density</button>
<button onclick="parameter('grainsize')">Grain Size</button>
<button onclick="parameter('wetness')">Liquid Water</button>

</body>
</html>
